services:
  - type: web
    name: sidequest-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: cd backend && npm start
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: sidequest
      - key: SESSION_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: BACKGROUND_JOB_SECRET
        sync: false
